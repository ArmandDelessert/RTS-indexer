# Cadence rapprochée : capter les articles pendant qu'ils sont visibles.
#
# Les flux RSS ne retiennent que leurs ~25 dernières publications, soit environ
# 24h pour la rubrique la plus active. Passé ce délai, un article qui a aussi
# quitté la première page de sa rubrique devient invisible pour toujours : le
# crawl ne pagine pas (robots.txt l'interdit) et Wayback n'archive qu'une
# fraction des pages, avec des mois de retard.
#
# D'où deux exécutions par jour plutôt qu'une : la fenêtre est de 24h, et le
# planificateur de GitHub Actions est « au mieux » — un cron peut être retardé
# de plusieurs dizaines de minutes aux heures chargées. Une seule exécution
# quotidienne n'aurait aucune marge. Les minutes choisies évitent les heures
# rondes, précisément pour fuir ces pics.

name: rss

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

jobs:
  collecte:
    # Un workflow réutilisable (`uses:`) est plafonné par les permissions du
    # job appelant, pas par ce que _collecte.yml demande lui-même : sans
    # cette ligne, l'appel échoue même si le dépôt autorise l'écriture par
    # défaut et même si _collecte.yml déclare `contents: write` de son côté.
    permissions:
      contents: write
    uses: ./.github/workflows/_collecte.yml
    with:
      commandes: rss
      resume: nouveaux articles captés par les flux RSS
