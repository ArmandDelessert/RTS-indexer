[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rts-indexer"
version = "0.1.0"
description = "Index des URLs du site rts.ch, stocké en texte dans le dépôt Git"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "lxml>=5.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
